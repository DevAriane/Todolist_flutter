name: todolist_flutter
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  objectbox: ^5.3.2
  objectbox_sync_flutter_libs: any
  path_provider: ^2.1.5
  google_fonts: ^8.1.0
  getxtra: ^5.0.4
  flutter_hsvcolor_picker: ^1.5.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  flutter_svg: ^2.3.0
  flutter_launcher_icons: ^0.14.4


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  objectbox_generator: any

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/chat.png" 
  min_sdk_android: 21 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
